name: Check TS SDK is up-to-date with the public api yml updated
run-name: ${{ github.actor }} pushed a commit 🚀
on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  ts-client-check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Install Node.js and NPM
        uses: actions/setup-node@v6
        with:
          node-version-file: ".nvmrc"

      - name: Npm CI
        run: npm ci

      - name: npm run openapi:generate
        run: npm run openapi:generate

      - name: Check for ./client changes
        run: |
          if git diff --name-only | grep --quiet '^client/'; then
            echo "::error::TS Client is out of date. Please run 'npm run openapi:generate' to regenerate the typescript client SDK."
            exit 1
          fi
