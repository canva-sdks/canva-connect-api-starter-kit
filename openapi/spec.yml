  schemas:
    AiCreditQuotaUsageSummary:
      description: A summary of the caller's AI credit quota usage at the time of
        the request.
      properties:
        used_percentage:
          description: |-
            The percentage of the caller's AI credit quota that has been consumed in the current
            billing interval, from 0 to 100.
          format: int32
          maximum: 100
          minimum: 0
          type: integer
        resets_at:
          description: |-
            Unix timestamp (seconds from the Unix epoch) of when the AI credit quota resets for
            the caller.
          format: int64
          type: integer
        using_bonus_credits:
          description: |-
            Whether the caller is currently consuming bonus AI credits (credits beyond their base
            plan allocation).
          type: boolean
      type: object
    AiCreditQuotaSuccessInfo:
      allOf:
      - $ref: '#/components/schemas/AiCreditQuotaUsageSummary'
      - properties:
          usage_review_link:
            description: |-
              A URL to the Canva AI credit usage dashboard where the caller can review their
              current AI credit consumption. Not present if unavailable.
            type: string
        type: object
      description: AI credit quota usage information returned on a successful generation
        request.
    AiCreditQuotaErrorInfo:
      allOf:
      - $ref: '#/components/schemas/AiCreditQuotaUsageSummary'
      - properties:
          upgrade_url:
            description: |-
              URL built from the user's current plan and eligibility for an AI pass. Not present
              if no upgrade path is available (e.g. already on highest plan or ineligible for AI pass).
            type: string
          cooldown_ends_at:
            description: |-
              Unix timestamp (seconds from the Unix epoch) of when the cooldown period ends. Only
              set when `code` is `ai_credit_quota_cooldown`. Not present for `ai_credit_quota_exceeded`
              errors.
            format: int64
            type: integer
          is_admin:
            description: |-
              Whether the caller is a team admin. Allows clients to tailor error messaging
              (e.g. "contact your admin" vs "upgrade your plan").
            type: boolean
          generation_pending:
            description: |-
              True if another generation is currently in flight and consuming quota. Only
              meaningful for paid users with cooldown enabled. Not present for free users where this
              cannot be determined.
            type: boolean
        required:
        - is_admin
        type: object
      description: |-
        AI credit quota information returned when a request is rejected due to quota exhaustion
        or a cooldown period.
    AiCreditQuotaError:
      allOf:
      - $ref: '#/components/schemas/Error'
      - properties:
          quota_usage:
            allOf:
            - $ref: '#/components/schemas/AiCreditQuotaErrorInfo'
            description: AI credit quota usage at the time of the error. Not present
              if quota data is unavailable.
        type: object
      description: |-
        Returned when a request is rejected because the caller has exceeded their AI credit quota
        or is in a cooldown period after heavy usage.
    GetDesignAnalyticsResponse:
      description: Aggregated analytics metrics for a design.
      properties:
        average_view_duration_seconds:
          description: The average view duration in seconds.
          example: 42
          format: int64
          type: integer
        total_view_duration_seconds:
          description: The total view duration in seconds.
          example: 5040
          format: int64
          type: integer
        unique_view_count:
          description: The number of unique viewers.
          example: 87
          format: int64
          type: integer
        total_view_count:
          description: The total number of views.
          example: 120
          format: int64
          type: integer
      required:
      - total_view_count
      - unique_view_count
      type: object
    GetDesignAnalyticsViewersResponse:
      description: Successful response from a `getDesignAnalyticsViewers` request.
      properties:
        items:
          description: The list of viewers.
          items:
            $ref: '#/components/schemas/Viewer'
          type: array
        continuation:
          description: |-
            If the success response contains a continuation token, there are more viewers you can list. You can use this token as a query parameter and retrieve more viewers from the list, for example `/v1/designs/{designId}/analytics/viewers?continuation={continuation}`.

            To retrieve all viewers, you might need to make multiple requests.
          example: RkFGMgXlsVTDbMd:MR3L0QjiaUzycIAjx0yMyuNiV0OildoiOwL0x32G4NjNu4FwtAQNxowUQNMMYN
          type: string
      required:
      - items
      type: object
    Viewer:
      description: A viewer and their engagement metrics for the design.
      properties:
        viewer_id:
          description: An opaque identifier for the viewer. Use this value when filtering
            page view results by viewer.
          example: b2d44753-f996-46ff-8f01-d4143911550f
          type: string
        user:
          allOf:
          - $ref: '#/components/schemas/TeamUser'
          description: The user details of the viewer. This is omitted for viewers
            whose identity is not visible.
        last_viewed_at:
          description: "When the viewer most recently opened the design, as a Unix\
            \ timestamp (in seconds since the Unix Epoch)."
          example: 1748044800
          format: int64
          type: integer
        viewer_type:
          $ref: '#/components/schemas/DesignAnalyticsViewerType'
        visibility:
          $ref: '#/components/schemas/DesignAnalyticsViewerVisibility'
        total_view_duration_seconds:
          description: "The total time this viewer has spent viewing the design, in\
            \ seconds."
          example: 312
          format: int64
          type: integer
        first_viewed_at:
          description: "When the viewer first viewed the design, as a Unix timestamp\
            \ (in seconds since the Unix Epoch)."
          example: 1745452800
          format: int64
          type: integer
        pages_viewed:
          description: The number of pages this viewer viewed for more than one second.
          example: 8
          format: int64
          type: integer
        form_factor:
          $ref: '#/components/schemas/DesignAnalyticsViewerFormFactor'
        device_operating_system:
          description: The simplified operating system name for the viewer's device.
          example: macOS
          type: string
        city_country:
          description: The viewer location as city and country. This is only returned
            for anonymous viewers.
          example: "Sydney, Australia"
          type: string
        total_view_count:
          description: The number of times this viewer opened the design.
          example: 14
          format: int64
          type: integer
      required:
      - last_viewed_at
      - viewer_id
      - viewer_type
      - visibility
      type: object
    DesignAnalyticsViewerType:
      description: How the viewer accessed the design.
      enum:
      - editor
      - commenter
      - viewer
      type: string
      x-enum-descriptions:
      - The viewer accessed the design with edit access.
      - The viewer accessed the design with comment access.
      - The viewer accessed the design with view-only access.
    DesignAnalyticsViewerVisibility:
      description: How this viewer should be presented to the caller.
      enum:
      - shown
      - anonymous
      - opt_out
      - another_team
      - deleted
      type: string
      x-enum-descriptions:
      - "The viewer's identity is visible, and their user details are included."
      - "The viewer is anonymous, so their identity is not available."
      - "The viewer has opted out of design analytics, but some data was already collected\
        \ for this viewer previosly."
      - "The viewer belongs to a different team, so their identity is not shared."
      - The viewer's account has been deleted.
    DesignAnalyticsViewerFormFactor:
      description: The device form factor used to view the design.
      enum:
      - small
      - large
      type: string
      x-enum-descriptions:
      - "A small device, such as a phone."
      - "A large device, such as a laptop, desktop, or large tablet."
    GetDesignAnalyticsViewsOverTimeResponse:
      description: Successful response from a `getDesignAnalyticsViewsOverTime` request.
      properties:
        items:
          description: The list of time buckets.
          items:
            $ref: '#/components/schemas/ViewsAtTime'
          type: array
        continuation:
          description: |-
            If the success response contains a continuation token, there are more time buckets you can list. You can use this token as a query parameter and retrieve more time buckets from the list, for example `/v1/designs/{designId}/analytics/views-over-time?continuation={continuation}`.

            To retrieve all time buckets, you might need to make multiple requests.
          example: RkFGMgXlsVTDbMd:MR3L0QjiaUzycIAjx0yMyuNiV0OildoiOwL0x32G4NjNu4FwtAQNxowUQNMMYN
          type: string
      required:
      - items
      type: object
    ViewsAtTime:
      description: A single time bucket of view counts.
      properties:
        count:
          description: The number of views in this bucket.
          example: 15
          format: int64
          type: integer
        bucket_start_at:
          description: "When this time bucket starts, as a Unix timestamp (in seconds\
            \ since the Unix Epoch)."
          example: 1745452800
          format: int64
          type: integer
      required:
      - bucket_start_at
      - count
      type: object
    GetDesignAnalyticsPageViewsRequest:
      description: Filters and pagination controls for page-level analytics.
      properties:
        page_ids:
          description: The design page IDs to retrieve view duration data for.
          example:
          - PBBKfZml7MRHRQVw
          - PBBKfZml7Mghjsdg
          items:
            example: PBBKfZml7MRHRQVw
            type: string
          maxItems: 100
          minItems: 1
          type: array
        limit:
          default: 50
          description: The maximum number of page results to return per page.
          example: 50
          format: int32
          maximum: 100
          minimum: 1
          type: integer
        continuation:
          description: |-
            If the success response contains a continuation token, there are more page results you can list. You can use this token in the request body and retrieve more page results from the list.

            To retrieve all page results, you might need to make multiple requests.
          example: RkFGMgXlsVTDbMd:MR3L0QjiaUzycIAjx0yMyuNiV0OildoiOwL0x32G4NjNu4FwtAQNxowUQNMMYN
          type: string
        filter:
          $ref: '#/components/schemas/PageViewFilter'
      required:
      - page_ids
      type: object
    PageViewFilter:
      description: A filter for page view data.
      discriminator:
        mapping:
          by_viewer: '#/components/schemas/PageViewFilterByViewer'
          for_editor: '#/components/schemas/PageViewFilterForEditor'
          by_link: '#/components/schemas/PageViewFilterByLink'
        propertyName: type
      oneOf:
      - $ref: '#/components/schemas/PageViewFilterByViewer'
      - $ref: '#/components/schemas/PageViewFilterForEditor'
      - $ref: '#/components/schemas/PageViewFilterByLink'
      type: object
    PageViewFilterByViewer:
      properties:
        type:
          enum:
          - by_viewer
          example: by_viewer
          type: string
        link_id:
          description: Filters to viewer traffic from a specific trackable link. Omit
            this field to target viewer traffic that did not come from a trackable
            link.
          example: hddb98a3716
          type: string
        viewer_id:
          description: The viewer ID to filter by.
          example: b2d44753-f996-46ff-8f01-d4143911550f
          type: string
      required:
      - type
      - viewer_id
      type: object
    PageViewFilterForEditor:
      properties:
        type:
          enum:
          - for_editor
          example: for_editor
          type: string
      required:
      - type
      type: object
    PageViewFilterByLink:
      properties:
        type:
          enum:
          - by_link
          example: by_link
          type: string
        link_id:
          description: The trackable link ID to filter by.
          example: hddb98a3716
          type: string
      required:
      - link_id
      - type
      type: object
    GetDesignAnalyticsPageViewsResponse:
      description: Successful response from a `getDesignAnalyticsPageViews` request.
      properties:
        items:
          description: The list of page view durations.
          items:
            $ref: '#/components/schemas/PageViewDuration'
          type: array
        continuation:
          description: |-
            If the success response contains a continuation token, there are more page results you can list. You can use this token in the request body and retrieve more page results from the list.

            To retrieve all page results, you might need to make multiple requests.
          example: RkFGMgXlsVTDbMd:MR3L0QjiaUzycIAjx0yMyuNiV0OildoiOwL0x32G4NjNu4FwtAQNxowUQNMMYN
          type: string
      required:
      - items
      type: object
    PageViewDuration:
      description: View duration metrics for a single page.
      properties:
        page_id:
          description: The page ID. This is omitted for design types that do not support
            page IDs.
          example: PBBKfZml7MRHRQVw
          type: string
        total_view_duration_seconds:
          description: "The total time spent viewing this page, in seconds."
          example: 1860
          format: int64
          type: integer
        average_duration_seconds:
          description: "The average time spent viewing this page, in seconds. This\
            \ is omitted for `by_viewer` filters."
          example: 21.5
          format: double
          type: number
        unique_view_count:
          description: The number of unique viewers for this page. This is omitted
            for `by_viewer` filters.
          example: 87
          format: int64
          type: integer
      required:
      - total_view_duration_seconds
      type: object
    GetDesignAnalyticsLinksResponse:
      description: Successful response from a `getDesignAnalyticsLinks` request.
      properties:
        items:
          description: The list of trackable links.
          items:
            $ref: '#/components/schemas/TrackableLink'
          type: array
        continuation:
          description: |-
            If the success response contains a continuation token, there are more links you can list. You can use this token as a query parameter and retrieve more links from the list, for example `/v1/designs/{designId}/analytics/links?continuation={continuation}`.

            To retrieve all links, you might need to make multiple requests.
          example: RkFGMgXlsVTDbMd:MR3L0QjiaUzycIAjx0yMyuNiV0OildoiOwL0x32G4NjNu4FwtAQNxowUQNMMYN
          type: string
      required:
      - items
      type: object
    TrackableLink:
      description: Metrics for a trackable link.
      properties:
        link_id:
          description: The ID of the trackable link.
          example: hddb98a3716
          type: string
        name:
          description: The user-visible name of the trackable link.
          example: Newsletter link
          type: string
        total_view_count:
          description: The total number of views for this link.
          example: 64
          format: int64
          type: integer
        unique_view_count:
          description: The number of unique viewers for this link.
          example: 41
          format: int64
          type: integer
        total_view_duration_seconds:
          description: "The total time this link has been viewed, in seconds."
          example: 2580
          format: int64
          type: integer
        average_view_duration_seconds:
          description: "The average time this link has been viewed, in seconds."
          example: 40
          format: int64
          type: integer
        last_viewed_at:
          description: "When this link was most recently viewed, as a Unix timestamp\
            \ (in seconds since the Unix Epoch)."
          example: 1748044800
          format: int64
          type: integer
      required:
      - link_id
      type: object
    GetAppJwksResponse:
      properties:
        keys:
          description: |-
            The value of the "keys" parameter is an array of JWK values. The order of keys has no
            meaning.
          items:
            $ref: '#/components/schemas/JsonWebKey'
          type: array
      required:
      - keys
      type: object
    CreateUrlAssetUploadJobRequest:
      properties:
        name:
          description: A name for the asset.
          example: My Awesome Asset
          maxLength: 255
          minLength: 1
          type: string
        url:
          description: The URL of the file to import. This URL must be accessible
            from the internet and be publicly available.
          example: https://example.com/my_asset_to_upload.jpg
          maxLength: 2048
          minLength: 8
          type: string
      required:
      - name
      - url
      type: object
    CreateUrlAssetUploadJobResponse:
      properties:
        job:
          $ref: '#/components/schemas/AssetUploadJob'
      required:
      - job
      type: object
    GetUrlAssetUploadJobResponse:
      properties:
        job:
          $ref: '#/components/schemas/AssetUploadJob'
      required:
      - job
      type: object
    GetAssetResponse:
      properties:
        asset:
          $ref: '#/components/schemas/Asset'
      required:
      - asset
      type: object
    UpdateAssetRequest:
      properties:
        name:
          description: |-
            The name of the asset. This is shown in the Canva UI.
            When this field is undefined or empty, nothing is updated.
          example: My Awesome Upload
          maxLength: 50
          type: string
        tags:
          description: |-
            The replacement tags for the asset.
            When this field is undefined, nothing is updated.
          example:
          - image
          - holiday
          - best day ever
          items:
            maxLength: 50
            type: string
          maxItems: 50
          type: array
      type: object
    UpdateAssetResponse:
      properties:
        asset:
          $ref: '#/components/schemas/Asset'
      required:
      - asset
      type: object
    Asset:
      description: "The asset object, which contains metadata about the asset."
      properties:
        type:
          $ref: '#/components/schemas/AssetType'
        id:
          description: The ID of the asset.
          example: Msd59349ff
          type: string
        name:
          description: The name of the asset.
          example: My Awesome Upload
          type: string
        tags:
          description: |-
            The user-facing tags attached to the asset.
            Users can add these tags to their uploaded assets, and they can search their uploaded
            assets in the Canva UI by searching for these tags. For information on how users use
            tags, see the
            [Canva Help Center page on asset tags](https://www.canva.com/help/add-edit-tags/).
          example:
          - image
          - holiday
          - best day ever
          items:
            type: string
          type: array
        import_status:
          $ref: '#/components/schemas/ImportStatus'
        created_at:
          description: |-
            When the asset was added to Canva, as a Unix timestamp (in seconds since the Unix
            Epoch).
          example: 1377396000
          format: int64
          type: integer
        updated_at:
          description: |-
            When the asset was last updated in Canva, as a Unix timestamp (in seconds since the
