          description: Not Found
        "429":
          content:
            application/json:
              examples:
                too_many_requests:
                  $ref: '#/components/examples/TooManyRequestsError'
              schema:
                $ref: '#/components/schemas/Error'
          description: Too Many Requests
        default:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
