  /v1/folders/{folderId}/items:
    get:
      description: |-
        Lists the items in a folder, including each item's `type`.

        Folders can contain:

        - Other folders.
        - Designs, such as Instagram posts, Presentations, and Documents ([Canva Docs](https://www.canva.com/create/documents/)).
        - Image assets.
        - Brand templates. To include `brand_template` items in the response, you must explicitly specify it in the `item_types` parameter.

          AVAILABILITY: Brand template items are only returned for users on a Canva plan with access to brand templates (such as Canva Pro, Canva Teams, or Canva Enterprise). For more information, see [Brand templates](https://www.canva.dev/docs/connect/api-reference/brand-templates/).

        Currently, video assets are not returned in the response.
      operationId: listFolderItems
      parameters:
      - description: The folder ID.
        example: FAF2lZtloor
        explode: false
        in: path
        name: folderId
        required: true
        schema:
          pattern: "^[a-zA-Z0-9_-]{1,50}$"
          type: string
        style: simple
      - description: |-
          If the success response contains a continuation token, the folder contains more items
          you can list. You can use this token as a query parameter and retrieve more
          items from the list, for example
          `/v1/folders/{folderId}/items?continuation={continuation}`.

          To retrieve all the items in a folder, you might need to make multiple requests.
        example: RkFGMgXlsVTDbMd:MR3L0QjiaUzycIAjx0yMyuNiV0OildoiOwL0x32G4NjNu4FwtAQNxowUQNMMYN
        explode: true
        in: query
        name: continuation
        required: false
        schema:
          type: string
        style: form
      - explode: true
        in: query
        name: limit
        required: false
        schema:
          default: 50
          description: The number of folder items to return.
          format: int32
          maximum: 100
          minimum: 1
          type: integer
        style: form
      - description: |-
          Filter the folder items to only return specified types. The available types are:
          `design`, `folder`, `image`, and `brand_template`. To filter for more than one item type,
          provide a comma-delimited list.

          If not specified, defaults to returning `design`, `folder`, and `image` items.
          To include `brand_template` items, you must explicitly specify it in this parameter.
        explode: false
        in: query
        name: item_types
        required: false
        schema:
          default:
          - design
          - folder
          - image
          items:
            $ref: '#/components/schemas/FolderItemType'
          type: array
        style: form
      - description: Sort the list of folder items.
        example: title_ascending
        explode: true
        in: query
        name: sort_by
        required: false
        schema:
          $ref: '#/components/schemas/FolderItemSortBy'
        style: form
      - description: Filter the folder items by their pinned status.
        explode: true
        in: query
        name: pin_status
        required: false
        schema:
          $ref: '#/components/schemas/FolderItemPinStatus'
        style: form
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListFolderItemsResponse'
          description: OK
        "403":
          content:
            application/json:
              examples:
                folder_access_not_allowed:
                  $ref: '#/components/examples/FolderAccessNotAllowedError'
              schema:
                $ref: '#/components/schemas/Error'
          description: Forbidden
        "404":
          content:
            application/json:
              examples:
                folder_not_found:
                  $ref: '#/components/examples/FolderNotFoundError'
              schema:
                $ref: '#/components/schemas/Error'
          description: Not Found
        default:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Error Response
      security:
      - oauthAuthCode:
        - folder:read
      tags:
      - folder
      x-rate-limit-per-client-user: 100
  /v1/folders/move:
