          format: int32
          type: integer
        height:
          description: The height of the image in pixels.
          example: 1080
          format: int32
          type: integer
        smart_tags:
          description: AI-generated tags for the image.
          example:
          - landscape
          - sunset
          - mountains
          - nature
          items:
            maxLength: 50
            type: string
          type: array
      required:
      - type
      type: object
    VideoMetadata:
      properties:
        type:
          enum:
          - video
          type: string
        width:
          description: The width of the video in pixels.
          example: 1920
          format: int32
          type: integer
        height:
          description: The height of the video in pixels.
          example: 1080
          format: int32
          type: integer
        duration:
          description: The duration of the video in seconds.
          example: 60
          format: int32
          type: integer
      required:
      - height
      - type
      - width
      type: object
    AssetSummary:
      description: An object representing an asset with associated metadata.
      properties:
        type:
          $ref: '#/components/schemas/AssetType'
        id:
          description: The ID of the asset.
          example: Msd59349ff
          type: string
        name:
          description: The name of the asset.
          example: My Awesome Upload
          type: string
        tags:
          description: |-
