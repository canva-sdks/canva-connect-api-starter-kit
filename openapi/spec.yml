            Any user mention tags are shown in the format `[user_id:team_id]`
          example: "*_Great work_* [oUnPjZ2k2yuhftbWF7873o:oBpVhLW22VrqtwKgaayRbP]!"
          type: string
      required:
      - plaintext
      type: object
    SuggestionEventType:
      description: "The type of suggestion event, along with additional type-specific\
        \ properties."
      discriminator:
        mapping:
          new: '#/components/schemas/NewSuggestionEventType'
          accepted: '#/components/schemas/AcceptedSuggestionEventType'
          rejected: '#/components/schemas/RejectedSuggestionEventType'
          reply: '#/components/schemas/ReplySuggestionEventType'
          mention: '#/components/schemas/MentionSuggestionEventType'
        propertyName: type
      oneOf:
      - $ref: '#/components/schemas/NewSuggestionEventType'
      - $ref: '#/components/schemas/AcceptedSuggestionEventType'
      - $ref: '#/components/schemas/RejectedSuggestionEventType'
      - $ref: '#/components/schemas/ReplySuggestionEventType'
      - $ref: '#/components/schemas/MentionSuggestionEventType'
      type: object
    NewSuggestionEventType:
      description: Event type for a new suggestion.
      properties:
        type:
          enum:
          - new
          type: string
        suggestion_url:
          description: "A URL to the design, focused on the suggestion."
          example: https://www.canva.com/design/3WCduQdjayTcPVM/z128cqanFu7E3/edit?ui=OdllGgZ4Snnq3MD8uI10bfA
          type: string
        suggestion:
          $ref: '#/components/schemas/Thread'
      required:
      - suggestion
      - suggestion_url
      - type
      type: object
    AcceptedSuggestionEventType:
      description: Event type for a suggestion that has been accepted.
      properties:
        type:
          enum:
          - accepted
          type: string
        suggestion_url:
          description: "A URL to the design, focused on the suggestion."
          example: https://www.canva.com/design/3WCduQdjayTcPVM/z128cqanFu7E3/edit?ui=OdllGgZ4Snnq3MD8uI10bfA
          type: string
        suggestion:
          $ref: '#/components/schemas/Thread'
      required:
      - suggestion
      - suggestion_url
      - type
      type: object
    RejectedSuggestionEventType:
      description: Event type for a suggestion that has been rejected.
      properties:
        type:
          enum:
          - rejected
          type: string
        suggestion_url:
          description: "A URL to the design, focused on the suggestion."
          example: https://www.canva.com/design/3WCduQdjayTcPVM/z128cqanFu7E3/edit?ui=OdllGgZ4Snnq3MD8uI10bfA
          type: string
        suggestion:
          $ref: '#/components/schemas/Thread'
      required:
      - suggestion
      - suggestion_url
      - type
      type: object
    ReplySuggestionEventType:
      description: Event type for a reply to a suggestion.
      properties:
        type:
          enum:
          - reply
          type: string
        reply_url:
          description: "A URL to the design, focused on the suggestion reply."
          example: https://www.canva.com/design/3WCduQdjayTcPVM/z128cqanFu7E3/edit?ui=OdllGgZ4Snnq3MD8uI10bfA
          type: string
        reply:
          $ref: '#/components/schemas/Reply'
      required:
      - reply
      - reply_url
      - type
      type: object
    MentionSuggestionEventType:
      description: Event type for a mention in a reply to a suggestion.
      properties:
        type:
          enum:
          - mention
          type: string
        reply_url:
          description: "A URL to the design, focused on the suggestion reply."
          example: https://www.canva.com/design/3WCduQdjayTcPVM/z128cqanFu7E3/edit?ui=OdllGgZ4Snnq3MD8uI10bfA
          type: string
        reply:
          $ref: '#/components/schemas/Reply'
      required:
      - reply
      - reply_url
      - type
      type: object
    UserMentions:
      additionalProperties:
        $ref: '#/components/schemas/UserMention'
      description: The Canva users mentioned in the comment thread or reply.
      example:
        oUnPjZ2k2yuhftbWF7873o:oBpVhLW22VrqtwKgaayRbP:
          tag: oUnPjZ2k2yuhftbWF7873o:oBpVhLW22VrqtwKgaayRbP
          user:
            user_id: oUnPjZ2k2yuhftbWF7873o
            team_id: oBpVhLW22VrqtwKgaayRbP
            display_name: John Doe
      type: object
    UserMention:
      description: Information about the user mentioned in a comment thread or reply.
        Each user mention is keyed using the user's user ID and team ID separated
        by a colon (`user_id:team_id`).
      properties:
        tag:
          description: The mention tag for the user mentioned in the comment thread
            or reply content. This has the format of the user's user ID and team ID
            separated by a colon (`user_id:team_id`).
          example: oUnPjZ2k2yuhftbWF7873o:oBpVhLW22VrqtwKgaayRbP
          type: string
        user:
          $ref: '#/components/schemas/TeamUser'
      required:
      - tag
      - user
      type: object
    GetSigningPublicKeysResponse:
      properties:
        keys:
          description: |-
            A Json Web Key Set (JWKS) with public keys used for signing webhooks. You can use this JWKS
            to verify that a webhook was sent from Canva.
          example:
          - kid: a418dc7d-ecc5-5c4b-85ce-e1104a8addbe
            kty: OKP
            crv: Ed25519
            x: aIQtqd0nDfB-ug0DrzZbwTum-1ITdXvKxGFak_1VB2j
          - kid: c8de5bec1-1b88-4ddaae04acc-ce415-5d7
            kty: OKP
            crv: Ed25519
            x: m2d1FT-gfBXxIzKwdQVTra0D-aBq_ubZ1jI0GuvkDtn
          items:
            $ref: '#/components/schemas/EdDsaJwk'
          type: array
      required:
      - keys
      type: object
    EdDsaJwk:
      description: |-
        A JSON Web Key Set (JWKS) using the Edwards-curve Digital Signature Algorithm (EdDSA), as
        described in [RFC-8037](https://www.rfc-editor.org/rfc/rfc8037.html#appendix-A).
      properties:
        kid:
          description: |-
            The `kid` (key ID) is a unique identifier for a public key. When the keys used
            to sign webhooks are rotated, you can use this ID to select the correct key
            within a JWK Set during the key rollover. The `kid` value is case-sensitive.
          type: string
        kty:
          description: |-
            The `kty` (key type) identifies the cryptographic algorithm family used with
            the key, such as "RSA" or "EC". Only Octet Key Pairs
            (`OKPs`) are supported.
            The `kty` value is case-sensitive. For more information on the `kty` property
            and OKPs, see [RFC-8037 — "kty" (Key Type)
            Parameter](https://www.rfc-editor.org/rfc/rfc8037.html#section-2).
          type: string
        crv:
          description: |-
            The `crv` (curve) property identifies the curve used for elliptical curve
            encryptions. Only "Ed25519" is supported. For more information on the `crv`
            property, see [RFC-8037 — Key Type
            "OKP"](https://www.rfc-editor.org/rfc/rfc8037.html#section-2).
          type: string
        x:
          description: |-
            The `x` property is the public key of an elliptical curve encryption. The key
            is Base64urlUInt-encoded. For more information on the `x` property, see
            [RFC-8037 — "x" (X Coordinate)
            Parameter](https://www.rfc-editor.org/rfc/rfc8037#section-2).
          type: string
      required:
      - crv
      - kid
      - kty
      - x
      type: object
    DataTable:
      description: |-
        Tabular data, structured in rows of cells.

        - Each cell must have a data type configured.
        - All rows must have the same number of cells.
        - The number of entries in `column_configs` must match the number of columns in the data.

        WARNING: Chart and sheet data fields are a [preview feature](https://www.canva.dev/docs/connect/#preview-apis). There might be unannounced breaking changes to this feature which won't produce a new API version.
      example:
        column_configs:
        - name: Geographic Region
          type: string
        - name: Sales (millions AUD)
          type: number
        - name: Target (millions AUD)
          type: number
        - name: Target met?
          type: boolean
        - name: Date met
          type: date
        - name: Logo
          type: media
        rows:
        - cells:
          - type: string
            value: Asia Pacific
          - type: number
            value: 10.2
            metadata:
              formatting: "#,##0.0"
          - type: number
            value: 10
            metadata:
              formatting: "#,##0.0"
          - type: boolean
            value: true
          - type: date
            value: 1721944387
          - type: media
            value:
            - type: image_upload
              url: https://example.com/apac-logo.png
              thumbnail_url: https://example.com/apac-logo-thumb.png
              mime_type: image/png
              ai_disclosure: none
            - type: video_upload
              url: https://example.com/apac-logo.mp4
              thumbnail_image_url: https://example.com/apac-logo-thumb.png
              thumbnail_video_url: https://example.com/apac-logo-thumb.mp4
              mime_type: video/mp4
              ai_disclosure: none
        - cells:
          - type: string
            value: EMEA
          - type: number
            value: 13.8
            metadata:
              formatting: "#,##0.0"
          - type: number
            value: 14
            metadata:
              formatting: "#,##0.0"
          - type: boolean
            value: false
          - type: date
          - type: media
            value: []
      properties:
        column_configs:
          description: Column definitions with names and data types.
          items:
            $ref: '#/components/schemas/ColumnConfig'
          type: array
        rows:
          description: Rows of data.
          items:
            $ref: '#/components/schemas/DataTableRow'
          type: array
      required:
      - rows
      type: object
    ColumnConfig:
      description: Configuration for a data table column.
      properties:
        name:
          description: "Name for the column, displayed as header text."
          type: string
        type:
          $ref: '#/components/schemas/ColumnDataType'
      required:
      - type
      type: object
    ColumnDataType:
      description: Expected data type for cells in this column.
      enum:
      - string
      - number
      - date
      - boolean
      - media
      - variant
      type: string
      x-enum-descriptions:
      - String data
      - Numeric data
      - Date data
      - Boolean data
      - "Media data (such as images, videos, or combinations of both)"
      - Mixed data types (use where the column contains cells of a combination of
        data types)
    DataTableRow:
      description: A single row of tabular data.
      properties:
        cells:
          description: |-
            Cells of data in row.

            All rows must have the same number of cells.
          items:
            $ref: '#/components/schemas/DataTableCell'
          type: array
      required:
      - cells
      type: object
    DataTableCell:
      description: A single tabular data cell.
      discriminator:
        mapping:
          string: '#/components/schemas/StringDataTableCell'
          number: '#/components/schemas/NumberDataTableCell'
          boolean: '#/components/schemas/BooleanDataTableCell'
          date: '#/components/schemas/DateDataTableCell'
          media: '#/components/schemas/MediaCollectionDataTableCell'
        propertyName: type
      oneOf:
      - $ref: '#/components/schemas/StringDataTableCell'
      - $ref: '#/components/schemas/NumberDataTableCell'
      - $ref: '#/components/schemas/BooleanDataTableCell'
      - $ref: '#/components/schemas/DateDataTableCell'
      - $ref: '#/components/schemas/MediaCollectionDataTableCell'
      type: object
    StringDataTableCell:
      description: A string tabular data cell.
      properties:
        type:
          enum:
          - string
          type: string
        value:
          maxLength: 10000
          type: string
      required:
      - type
      type: object
    NumberDataTableCell:
      description: A number tabular data cell.
      properties:
        type:
          enum:
          - number
          type: string
        value:
          format: double
          type: number
        metadata:
          $ref: '#/components/schemas/NumberCellMetadata'
      required:
      - type
      type: object
    NumberCellMetadata:
      description: Formatting metadata for number cells.
      properties:
        formatting:
          description: |-
            Formatting pattern using Office Open XML Format.

            These patterns control how numbers are displayed to users, including currency symbols,
            decimal places, and separators.
          type: string
      type: object
    BooleanDataTableCell:
      description: A boolean tabular data cell.
      properties:
        type:
          enum:
          - boolean
          type: string
        value:
          type: boolean
      required:
      - type
      type: object
    DateDataTableCell:
      description: |-
        A date tabular data cell.

        Specified as a Unix timestamp (in seconds since the Unix Epoch).
      properties:
        type:
          enum:
          - date
          type: string
        value:
          format: int64
          type: integer
      required:
      - type
      type: object
    MediaCollectionDataTableCell:
      description: Cell containing a media collection.
      properties:
        type:
          enum:
          - media
          type: string
        value:
          description: |-
            Media collection values.

            Provide an empty array for an empty cell.
          items:
            $ref: '#/components/schemas/DataTableMedia'
          maxItems: 20
          type: array
      required:
      - type
      - value
      type: object
    DataTableMedia:
      discriminator:
        mapping:
          image_upload: '#/components/schemas/DataTableImageUpload'
          video_upload: '#/components/schemas/DataTableVideoUpload'
        propertyName: type
      oneOf:
      - $ref: '#/components/schemas/DataTableImageUpload'
      - $ref: '#/components/schemas/DataTableVideoUpload'
    DataTableImageUpload:
      description: Options for uploading an image asset.
      properties:
        type:
          enum:
          - image_upload
          type: string
        url:
          description: |-
            The URL of the image file to upload.
            This can be an external URL or a data URL.
          type: string
        thumbnail_url:
          description: |-
            The URL of a thumbnail image to display while the image is queued for upload.
            This can be an external URL or a data URL.
          type: string
        mime_type:
          $ref: '#/components/schemas/DataTableImageMimeType'
        width:
          description: The width of the image in pixels.
          format: int32
          type: integer
        height:
          description: The height of the image in pixels.
          format: int32
          type: integer
        ai_disclosure:
          $ref: '#/components/schemas/DataTableAiDisclosure'
      required:
      - ai_disclosure
      - mime_type
      - thumbnail_url
      - type
      - url
      type: object
    DataTableVideoUpload:
      description: Options for uploading a video asset.
      properties:
        type:
          enum:
          - video_upload
          type: string
        url:
          description: The URL of the video file to upload.
          type: string
        thumbnail_image_url:
          description: |-
            The URL of a thumbnail image to use as a fallback if thumbnailVideoUrl isn't provided.
            This can be an external URL or a data URL.
          type: string
        thumbnail_video_url:
          description: The URL of a thumbnail video to display while the video is
            queued for upload.
          type: string
        mime_type:
          $ref: '#/components/schemas/DataTableVideoMimeType'
        width:
          description: The width of the video in pixels.
          format: int32
          type: integer
        height:
          description: The height of the video in pixels.
          format: int32
          type: integer
        ai_disclosure:
          $ref: '#/components/schemas/DataTableAiDisclosure'
      required:
      - ai_disclosure
      - mime_type
      - thumbnail_image_url
      - type
      - url
      type: object
    DataTableImageMimeType:
      description: The MIME type of an image file that's supported by Canva's backend.
      enum:
      - image/jpeg
      - image/heic
      - image/png
      - image/svg+xml
      - image/webp
      - image/tiff
      type: string
    DataTableVideoMimeType:
      description: The MIME type of a video file that's supported by Canva's backend.
      enum:
      - video/avi
      - video/x-msvideo
      - image/gif
      - video/x-m4v
      - video/x-matroska
      - video/quicktime
      - video/mp4
      - video/mpeg
      - video/webm
      - application/json
      type: string
      x-enum-descriptions:
      - ""
      - ""
      - "GIFs are treated as videos, not images."
      - ""
      - ""
      - ""
      - ""
      - ""
      - ""
      - Used for Lottie files.
    DataTableAiDisclosure:
      description: A disclosure identifying if the app generated this media asset
        using AI.
      enum:
      - app_generated
      - none
      type: string
      x-enum-descriptions:
      - App creates or significantly alters content using AI
      - No AI involvement in creation or alteration
    SortByType:
      default: relevance
      enum:
      - relevance
      - modified_descending
      - modified_ascending
      - title_descending
      - title_ascending
      type: string
      x-enum-descriptions:
      - Sort results using a relevance algorithm.
      - Sort results by the date last modified in descending order.
      - Sort results by the date last modified in ascending order.
      - Sort results by title in descending order.
      - Sort results by title in ascending order
    OwnershipType:
      default: any
      enum:
      - any
      - owned
      - shared
      type: string
      x-enum-descriptions:
      - Owned by and shared with the user.
      - Owned by the user.
      - Shared with the user.
    GetListDesignResponse:
      properties:
        continuation:
          description: |-
            A continuation token.
            If the success response contains a continuation token, the list contains more designs
            you can list. You can use this token as a query parameter and retrieve more
            designs from the list, for example
            `/v1/designs?continuation={continuation}`.

            To retrieve all of a user's designs, you might need to make multiple requests.
          example: RkFGMgXlsVTDbMd:MR3L0QjiaUzycIAjx0yMyuNiV0OildoiOwL0x32G4NjNu4FwtAQNxowUQNMMYN
          type: string
        items:
          description: The list of designs.
          items:
            $ref: '#/components/schemas/Design'
          type: array
      required:
      - items
      type: object
    CreateDesignRequest:
      description: |-
        Body parameters for creating a new design. Use the `type` discriminator to choose the creation mode:

        - Use `type_and_asset` to create a design by specifying the design type and/or an asset.
        - Use `design` to create a copy of an existing design (currently a [preview feature](https://www.canva.dev/docs/connect/#preview-apis)).
        - Use `brand_template` to create a design from a brand template (currently a [preview feature](https://www.canva.dev/docs/connect/#preview-apis)).

        NOTE: For backward compatibility, if `type` isn't specified in the request,
        the request type will be assumed to be `type_and_asset`.
      discriminator:
        mapping:
          type_and_asset: '#/components/schemas/DesignTypeCreateDesignRequest'
          design: '#/components/schemas/DesignCreateDesignRequest'
          brand_template: '#/components/schemas/BrandTemplateCreateDesignRequest'
        propertyName: type
      oneOf:
      - $ref: '#/components/schemas/DesignTypeCreateDesignRequest'
      - $ref: '#/components/schemas/DesignCreateDesignRequest'
      - $ref: '#/components/schemas/BrandTemplateCreateDesignRequest'
      type: object
    DesignTypeCreateDesignRequest:
      description: |-
        Create a design by specifying the design type and/or an asset.
        At least one of `design_type` or `asset_id` must be defined.
      properties:
        type:
          description: "For backward compatibility, if `type` isn't specified in the\
            \ request, the request type will be assumed to be `type_and_asset`."
          enum:
          - type_and_asset
          type: string
        design_type:
          $ref: '#/components/schemas/DesignTypeInput'
        asset_id:
          description: "The ID of an asset to insert into the created design. Currently,\
            \ this only supports image assets."
          example: Msd59349ff
          type: string
        title:
          description: The name of the design.
          example: My Holiday Presentation
          maxLength: 255
          minLength: 1
          type: string
      required:
      - type
      type: object
    DesignCreateDesignRequest:
      description: |-
        <Warning>

        Creating a copy of an existing design is currently provided as a preview. Be aware of the following:

        - There might be unannounced breaking changes.
        - Any breaking changes to preview features won't produce a new [API version](https://www.canva.dev/docs/connect/versions/).
        - Public integrations that use preview features will not pass the review process, and can't be made available to all Canva users.

        </Warning>

        Body parameters for creating a copy of an existing design.
      properties:
        type:
          enum:
          - design
          type: string
        design_id:
          description: The ID of the design to copy.
          example: DAFVztcvetc
          pattern: "^[a-zA-Z0-9_-]{1,50}$"
          type: string
        page_numbers:
          description: |-
            The pages to copy from the source design. If not specified, all pages are copied.
            Pages are indexed using one-based numbering.
          items:
            format: int32
            minimum: 1
            type: integer
          minItems: 1
          type: array
      required:
      - design_id
      - type
      type: object
    BrandTemplateCreateDesignRequest:
      description: |-
        <Warning>

        Creating a copy from a brand template is currently provided as a preview. Be aware of the following:

        - There might be unannounced breaking changes.
        - Any breaking changes to preview features won't produce a new [API version](https://www.canva.dev/docs/connect/versions/).
        - Public integrations that use preview features will not pass the review process, and can't be made available to all Canva users.

        </Warning>

        Body parameters for creating a copy from a brand template.
      properties:
        type:
          enum:
          - brand_template
          type: string
        brand_template_id:
          description: The ID of the brand template used to create a design copy.
          example: EDMzWSwy3BI
          pattern: "^[a-zA-Z0-9_-]{1,50}$"
          type: string
        page_numbers:
          description: |-
            The pages to copy from the brand template. If not specified, all pages are copied.
            Pages are indexed using one-based numbering.
          items:
            format: int32
            minimum: 1
            type: integer
          minItems: 1
          type: array
      required:
      - brand_template_id
      - type
      type: object
    CreateDesignResponse:
      description: Details about the new design.
      properties:
        design:
          $ref: '#/components/schemas/Design'
      required:
      - design
      type: object
    CreatePrintPartnerDesignRequest:
      description: Body parameters for creating a new design for a Print Partner.
      properties:
        design_source:
          $ref: '#/components/schemas/PrintPartnerDesignSource'
        title:
          description: The name of the design.
          example: My Holiday Presentation
          maxLength: 255
          minLength: 1
          type: string
        bleed:
          default: 3000
          description: |-
            Bleed in microns to apply around the design in the editor. Bleed is the area
            outside the trim line used to avoid white edges after cutting. Use 0 for no bleed. If bleed is not
            specified, a default of 3000 microns is used.
          format: int32
          maximum: 150000
          minimum: 0
          type: integer
        min_pages:
          description: |-
            Minimum number of pages the design must have in the editor. The user cannot
            reduce the page count below this value. If both min_pages and max_pages are
            provided, min_pages must be less than or equal to max_pages.
          format: int32
          maximum: 500
          minimum: 1
          type: integer
        max_pages:
          description: |-
            Maximum number of pages the design can have in the editor. The user cannot
            add pages beyond this value. If both min_pages and max_pages are provided,
            min_pages must be less than or equal to max_pages.
          format: int32
          maximum: 500
          minimum: 1
          type: integer
      required:
      - design_source
      type: object
    CreatePrintPartnerDesignResponse:
      description: Details about the new design.
      properties:
        design:
          $ref: '#/components/schemas/Design'
      required:
      - design
      type: object
    PrintPartnerDesignSource:
      description: The desired source for the design creation.
      discriminator:
        mapping:
          partner_product_id: '#/components/schemas/PrintPartnerProductIdDesignSource'
          dimensions: '#/components/schemas/PrintPartnerDimensionsDesignSource'
        propertyName: type
      oneOf:
      - $ref: '#/components/schemas/PrintPartnerProductIdDesignSource'
      - $ref: '#/components/schemas/PrintPartnerDimensionsDesignSource'
      type: object
    PrintPartnerProductIdDesignSource:
      description: Creates a design using an external partner product ID.
      properties:
        type:
          enum:
          - partner_product_id
          type: string
        partner_product_id:
          description: The ID of the partner-defined product.
          example: CVAFDC1091
          pattern: "^[a-zA-Z0-9_-]{1,50}$"
          type: string
      required:
      - partner_product_id
      - type
      type: object
    PrintPartnerDimensionsDesignSource:
      description: Creates a design that matches your dimensions. Add a product type
        for more precise template matches.
      properties:
        type:
          enum:
          - dimensions
          type: string
        dimensions:
          $ref: '#/components/schemas/PrintPartnerDesignDimensions'
        product_type:
          description: "The product type is used alongside your dimensions to find\
            \ a matching product in Canva Print's product catalogue, and templates\
            \ for that product are recommended. If no match is found, only dimensions\
            \ are used, so templates may include unrelated product types."
          example: tshirt
          type: string
      required:
      - dimensions
      - type
      type: object
    PrintPartnerDesignDimensions:
      description: |-
        Dimensions of the design. Used to match a product type, or to create a custom-size design if
        no product matches.
      properties:
        width:
          description: The width of the design.
          example: 595
          format: double
          minimum: 1
          type: number
        height:
          description: The height of the design.
          example: 1295
          format: double
          minimum: 1
          type: number
        units:
          $ref: '#/components/schemas/PrintPartnerDesignDimensionsUnits'
      required:
      - height
      - units
      - width
      type: object
    PrintPartnerDesignDimensionsUnits:
      description: The units of the dimensions.
      enum:
      - in
      - cm
      - mm
      type: string
    GetDesignResponse:
      description: Successful response from a `getDesign` request.
      properties:
        design:
          $ref: '#/components/schemas/Design'
      required:
      - design
      type: object
    GetPrintPartnerDesignResponse:
      description: Successful response from a `getPrintPartnerDesign` request.
      properties:
        design:
          $ref: '#/components/schemas/Design'
      required:
      - design
      type: object
    GetDesignPagesResponse:
      description: Successful response from a `getDesignPages` request.
      properties:
        items:
          description: The list of pages.
          items:
            $ref: '#/components/schemas/DesignPage'
          type: array
      required:
      - items
      type: object
    GetDesignExportFormatsResponse:
      description: Successful response from a `getDesignExportFormats` request.
      properties:
        formats:
          $ref: '#/components/schemas/ExportFormatOptions'
      required:
      - formats
      type: object
    Design:
      description: "The design object, which contains metadata about the design."
      properties:
        id:
          description: The design ID.
          example: DAFVztcvd9z
          type: string
        title:
          description: The design title.
          example: My summer holiday
          type: string
        owner:
          $ref: '#/components/schemas/TeamUserSummary'
        thumbnail:
          $ref: '#/components/schemas/Thumbnail'
        urls:
          $ref: '#/components/schemas/DesignLinks'
        created_at:
          description: |-
            When the design was created in Canva, as a Unix timestamp (in seconds since the Unix
            Epoch).
          example: 1377396000
          format: int64
          type: integer
        updated_at:
          description: |-
            When the design was last updated in Canva, as a Unix timestamp (in seconds since the
            Unix Epoch).
          example: 1692928800
          format: int64
          type: integer
        page_count:
          description: "The total number of pages in the design. Some design types\
            \ don't have pages (for example, Canva docs)."
          example: 5
          format: int32
          minimum: 0
          type: integer
        design_types:
          description: The type of content a design or page contains. The list of
            design types may grow over time. The `unknown` value represents design
            types that haven't been added to the list.
          example:
          - presentation
          items:
            $ref: '#/components/schemas/DesignTypeOutputName'
          type: array
      required:
      - created_at
      - design_types
      - id
      - owner
      - updated_at
      - urls
      type: object
    PageNumber:
      description: The 1-based page number within the design. The first page in a
        design has the value `1`.
      example: 1
      format: int32
      maximum: 500
      minimum: 1
      type: integer
    PageDimensions:
      description: "The dimensions of a design page, if it is bounded. Design pages\
        \ for non-bounded designs like Whiteboards and Docs will not include this\
        \ property."
      properties:
        width:
          description: The width of the design page in pixels.
          example: 595
          format: double
          type: number
        height:
          description: The height of the design page in pixels.
          example: 1295
          format: double
          type: number
      required:
      - height
      - width
      type: object
    DesignLinks:
      description: A temporary set of URLs for viewing or editing the design.
      properties:
        edit_url:
          description: |-
            A temporary editing URL for the design. This URL is only accessible to the user that made the API request, and is designed to support [return navigation](https://www.canva.dev/docs/connect/return-navigation-guide/) workflows.

            NOTE: This is not a permanent URL, it is only valid for 30 days.
          example: https://www.canva.com/api/design/eyJhbGciOiJkaXIiLCJlbmMiOiJBMjU2R0NNIiwiZXhwaXJ5IjoxNzQyMDk5NDAzMDc5fQ..GKLx2hrJa3wSSDKQ.hk3HA59qJyxehR-ejzt2DThBW0cbRdMBz7Fb5uCpwD-4o485pCf4kcXt_ypUYX0qMHVeZ131YvfwGPIhbk-C245D8c12IIJSDbZUZTS7WiCOJZQ.sNz3mPSQxsETBvl_-upMYA/edit
          type: string
        view_url:
          description: |
            A temporary viewing URL for the design. This URL is only accessible to the user that made the API request, and is designed to support [return navigation](https://www.canva.dev/docs/connect/return-navigation-guide/) workflows.

            NOTE: This is not a permanent URL, it is only valid for 30 days.
          example: https://www.canva.com/api/design/eyJhbGciOiJkaXIiLCJlbmMiOiJBMjU2R0NNIiwiZXhwaXJ5IjoxNzQyMDk5NDAzMDc5fQ..GKLx2hrJa3wSSDKQ.hk3HA59qJyxehR-ejzt2DThBW0cbRdMBz7Fb5uCpwD-4o485pCf4kcXt_ypUYX0qMHVeZ131YvfwGPIhbk-C245D8c12IIJSDbZUZTS7WiCOJZQ.sNz3mPSQxsETBvl_-upMYA/view
          type: string
      required:
      - edit_url
      - view_url
      type: object
    DesignSummary:
      description: "Basic details about the design, such as the design's ID, title,\
        \ and URL."
      properties:
        id:
          description: The design ID.
          example: DAFVztcvd9z
          type: string
        title:
          description: The design title.
          example: My summer holiday
          type: string
        url:
          description: URL of the design.
          example: https://www.canva.com/design/DAFVztcvd9z/edit
          type: string
        thumbnail:
          $ref: '#/components/schemas/Thumbnail'
        urls:
          $ref: '#/components/schemas/DesignLinks'
        created_at:
          description: |-
            When the design was created in Canva, as a Unix timestamp (in seconds since the Unix
            Epoch).
          example: 1377396000
          format: int64
          type: integer
        updated_at:
          description: |-
            When the design was last updated in Canva, as a Unix timestamp (in seconds since the
            Unix Epoch).
          example: 1692928800
          format: int64
          type: integer
        page_count:
          description: "The total number of pages in the design. Some design types\
            \ don't have pages (for example, Canva docs)."
          example: 3
          format: int32
          minimum: 0
          type: integer
      required:
      - created_at
      - id
      - updated_at
      - urls
      type: object
    DesignPage:
      description: "Basic details about a page in a design, such as the page number\
        \ and thumbnail."
      properties:
        id:
          description: |-
            The ID of the page. This ID is unique within the design and can be used to
            correlate a page with per-page data from other APIs.

            Some designs might not have page IDs, in which case this property is omitted.
          example: PB2NFQ9W78kLDFCK
          type: string
        index:
          deprecated: true
          description: |-
            WARNING: This property is deprecated. Use `page_number` instead, which returns an identical value.

            The index of the page in the design. The first page in a design has the index value `1`.
          format: int32
          maximum: 500
          minimum: 1
          type: integer
        page_number:
          description: The 1-based page number within the design. The first page in
            a design has the value `1`.
          example: 1
          format: int32
          maximum: 500
          minimum: 1
          type: integer
        dimensions:
          $ref: '#/components/schemas/PageDimensions'
        thumbnail:
          $ref: '#/components/schemas/Thumbnail'
        design_type:
          $ref: '#/components/schemas/DesignTypeOutputName'
      required:
      - design_type
      - index
      - page_number
      type: object
    GetDesignDatasetResponse:
      description: Successful response from a `getDesignDataset` request.
      properties:
        dataset:
          additionalProperties:
            $ref: '#/components/schemas/DataField'
          description: |-
            The dataset definition. It contains the data inputs available for use with the
            [Create design autofill job API](https://www.canva.dev/docs/connect/api-reference/autofills/create-design-autofill-job/).
          example:
            cute_pet_image_of_the_day:
              type: image
            cute_pet_witty_pet_says:
              type: text
            cute_pet_sales_chart:
              type: chart
          type: object
      type: object
    DatasetDefinition:
      additionalProperties:
        $ref: '#/components/schemas/DataField'
      description: |-
        The dataset definition. It contains the data inputs available for use with the
        [Create design autofill job API](https://www.canva.dev/docs/connect/api-reference/autofills/create-design-autofill-job/).
      example:
        cute_pet_image_of_the_day:
          type: image
        cute_pet_witty_pet_says:
          type: text
        cute_pet_sales_chart:
          type: chart
      type: object
    DataField:
      description: A named data field that can be autofilled.
      discriminator:
        mapping:
          image: '#/components/schemas/ImageDataField'
          text: '#/components/schemas/TextDataField'
          chart: '#/components/schemas/ChartDataField'
        propertyName: type
      oneOf:
      - $ref: '#/components/schemas/ImageDataField'
      - $ref: '#/components/schemas/TextDataField'
      - $ref: '#/components/schemas/ChartDataField'
      type: object
    ImageDataField:
      description: |-
        An image data field. You can autofill it with an image by providing its `asset_id`.

        You can also autofill it with a video asset. Autofilling a video is currently a [preview feature](https://www.canva.dev/docs/connect/#preview-apis).
      properties:
        type:
          enum:
          - image
          type: string
      required:
      - type
      type: object
    TextDataField:
      description: A text data field. You can autofill it with a text value.
      properties:
        type:
          enum:
          - text
          type: string
      required:
      - type
      type: object
    ChartDataField:
      description: |-
        A chart data field. You can autofill it with tabular data.

        WARNING: Chart data fields are a [preview feature](https://www.canva.dev/docs/connect/#preview-apis). There might be unannounced breaking changes to this feature which won't produce a new API version.
      properties:
        type:
          enum:
          - chart
          type: string
      required:
      - type
      type: object
    DesignImportMetadata:
      description: Metadata about the design that you include as a header parameter
        when importing a design.
      properties:
        title_base64:
          description: |-
            The design's title, encoded in Base64.

            The maximum length of a design title in Canva (unencoded) is 50 characters.

            Base64 encoding allows titles containing emojis and other special
            characters to be sent using HTTP headers.
            For example, "My Awesome Design 😍" Base64 encoded
            is `TXkgQXdlc29tZSBEZXNpZ24g8J+YjQ==`.
          example: TXkgQXdlc29tZSBEZXNpZ24g8J+YjQ==
          minLength: 1
          type: string
        mime_type:
          description: "The MIME type of the file being imported. If not provided,\
            \ Canva attempts to automatically detect the type of the file."
          example: application/pdf
          type: string
      required:
      - title_base64
      type: object
    CreateDesignImportJobResponse:
      properties:
        job:
          $ref: '#/components/schemas/DesignImportJob'
      required:
      - job
      type: object
    DesignImportJob:
      description: The status of the design import job.
      properties:
        id:
          description: The ID of the design import job.
          example: e08861ae-3b29-45db-8dc1-1fe0bf7f1cc8
          pattern: "^[a-zA-Z0-9_-]{1,50}$"
          type: string
        status:
          $ref: '#/components/schemas/DesignImportStatus'
        result:
          $ref: '#/components/schemas/DesignImportJobResult'
        error:
          $ref: '#/components/schemas/DesignImportError'
      required:
      - id
      - status
      type: object
    DesignImportStatus:
      description: The status of the design import job.
      enum:
      - failed
      - in_progress
      - success
      example: success
      type: string
    DesignImportError:
      description: "If the import job fails, this object provides details about the\
        \ error."
      properties:
        code:
          $ref: '#/components/schemas/DesignImportErrorCode'
        message:
          description: A human-readable description of what went wrong.
          example: "We're sorry, but the file upload quota has exceeded. Please try\
            \ again later."
          type: string
      required:
      - code
      - message
      type: object
    DesignImportErrorCode:
      description: |-
        A short string about why the import failed. This field can be used to handle errors
        programmatically.
      enum:
      - design_creation_throttled
      - design_import_throttled
      - duplicate_import
      - internal_error
      - invalid_file
      - fetch_failed
      example: design_creation_throttled
      type: string
    DesignImportJobResult:
      properties:
        designs:
          description: |-
            A list of designs imported from the external file. It usually contains one item.
            Imports with a large number of pages or assets are split into multiple designs.
          items:
            $ref: '#/components/schemas/DesignSummary'
          type: array
      required:
      - designs
      type: object
    GetDesignImportJobResponse:
      properties:
        job:
          $ref: '#/components/schemas/DesignImportJob'
      required:
      - job
      type: object
    CreateUrlImportJobRequest:
      properties:
        title:
          description: A title for the design.
          example: My Awesome Design
          maxLength: 255
          minLength: 1
          type: string
        url:
          description: The URL of the file to import. This URL must be accessible
            from the internet and be publicly available.
          maxLength: 2048
          minLength: 1
          type: string
        mime_type:
          description: "The MIME type of the file being imported. If not provided,\
            \ Canva attempts to automatically detect the type of the file."
          example: application/vnd.apple.keynote
          maxLength: 100
          minLength: 1
          type: string
      required:
      - title
      - url
      type: object
    CreateUrlImportJobResponse:
      properties:
        job:
          $ref: '#/components/schemas/DesignImportJob'
      required:
      - job
      type: object
    GetUrlImportJobResponse:
      properties:
        job:
          $ref: '#/components/schemas/DesignImportJob'
      required:
      - job
      type: object
    DesignTypeInput:
      description: The desired design type.
      discriminator:
        mapping:
          preset: '#/components/schemas/PresetDesignTypeInput'
          custom: '#/components/schemas/CustomDesignTypeInput'
        propertyName: type
      oneOf:
      - $ref: '#/components/schemas/PresetDesignTypeInput'
      - $ref: '#/components/schemas/CustomDesignTypeInput'
      type: object
    PresetDesignTypeInput:
      description: Provide the common design type.
      properties:
        type:
          enum:
          - preset
          type: string
        name:
          $ref: '#/components/schemas/PresetDesignTypeName'
      required:
      - name
      - type
      type: object
    PresetDesignTypeName:
      description: The name of the design type.
      enum:
      - doc
      - email
      - presentation
      - whiteboard
      type: string
      x-enum-descriptions:
      - "A [Canva doc](https://www.canva.com/docs/); a document for Canva's online\
        \ text editor."
      - "An [email](https://www.canva.com/emails/); for creating email campaign designs."
      - "A [presentation](https://www.canva.com/presentations/); lets you create and\
        \ collaborate for presenting to an audience."
      - "A [whiteboard](https://www.canva.com/online-whiteboard/); a design which\
        \ gives you infinite space to collaborate."
    CustomDesignTypeInput:
      description: |-
        Provide the width and height to define a custom design type.

        Each dimension must be between 40 and 8000 pixels, and the
        total area (width × height) must not exceed 25,000,000 pixels
        squared. For example, a design with a width of 8000 pixels can
        have a maximum height of 3125 pixels.
      properties:
        type:
          enum:
          - custom
          type: string
        width:
          description: "The width of the design, in pixels."
          example: 320
          format: int32
          maximum: 8000
          minimum: 40
          type: integer
        height:
          description: "The height of the design, in pixels."
          example: 200
          format: int32
          maximum: 8000
          minimum: 40
          type: integer
      required:
      - height
      - type
      - width
      type: object
    DesignTypeOutputName:
      description: The type of content a design or page contains. The list of design
        types may grow over time. The `unknown` value represents design types that
        haven't been added to the list.
      enum:
      - doc
      - email
      - presentation
      - sheet
      - whiteboard
      - custom
      - unknown
      example: presentation
      type: string
    Error:
      properties:
        code:
          $ref: '#/components/schemas/ErrorCode'
        message:
          description: A human-readable description of what went wrong.
          type: string
      required:
      - code
      - message
      type: object
    FeatureQuotaExceededError:
      allOf:
      - $ref: '#/components/schemas/Error'
      - properties:
          upsell_url:
            description: URL to redirect users to upgrade their Canva account and
              reset their quota.
            type: string
        required:
        - upsell_url
        type: object
      description: Feature quota exceeded
    OauthError:
      properties:
        error:
          $ref: '#/components/schemas/ErrorCode'
        error_description:
          description: A human-readable description of what went wrong.
          type: string
      required:
      - error
      - error_description
      type: object
    ErrorCode:
      description: |
        A short string indicating what failed. This field can be used to handle errors programmatically.
      enum:
      - internal_error
      - invalid_field
      - invalid_header_value
      - permission_denied
      - too_many_requests
      - not_found
      - bad_request_body
      - bad_http_method
      - bad_request_params
      - bad_query_params
      - user_role_required
      - endpoint_not_found
      - endpoint_gone
      - unsupported_version
      - invalid_access_token
      - revoked_access_token
      - missing_field
      - missing_scope
      - invalid_grant
      - invalid_request
      - invalid_client
      - unauthorized_client
      - unsupported_grant_type
      - invalid_scope
      - invalid_basic_header
      - invalid_file_format
      - quota_exceeded
      - ai_credit_quota_exceeded
      - ai_credit_quota_cooldown
      - unsupported_content_type
      - request_too_large
      - folder_not_found
      - item_in_multiple_folders
      - asset_not_found
      - max_limit_reached
      - permission_not_found
      - permission_exists
      - unauthorized_user
      - user_not_found
      - user_not_eligible
      - group_not_found
      - app_not_found
      - app_has_non_draft_versions
      - invalid_status_transition
      - translation_validation_failed
      - content_not_found
      - doctype_not_found
      - design_not_found
      - offset_too_large
      - page_not_found
      - design_or_comment_not_found
      - design_or_thread_not_found
      - review_dismissed
      - design_content_changed
      - design_type_not_found
      - team_not_found
      - team_is_default
      - comment_not_found
      - too_many_comments
      - too_many_replies
      - message_too_long
      - thread_not_found
      - reply_not_found
      - design_not_fillable
      - autofill_data_invalid
      - feature_not_available
      - unsupported_design_type
      - design_generation_not_enabled
      - license_required
      - input_unsafe
      - display_name_unavailable
      - user_not_managed
      - saml_team_id_conflict
      - saml_name_id_not_available
      - user_email_unverified
      - user_not_active
      - user_pending_consent
      - account_exists
      type: string
    CreateDesignExportJobRequest:
      description: |-
        Body parameters for starting an export job for a design.
        It must include a design ID, and one of the supported export formats.
      example:
        design_id: DAVZr1z5464
        format:
          type: pdf
          size: a4
          pages:
          - 2
          - 3
          - 4
      properties:
        design_id:
          description: The design ID.
          type: string
        format:
          $ref: '#/components/schemas/ExportFormat'
      required:
      - design_id
      - format
      type: object
    ExportFormat:
      description: Details about the desired export format.
      discriminator:
        mapping:
          pdf: '#/components/schemas/PdfExportFormat'
          jpg: '#/components/schemas/JpgExportFormat'
          png: '#/components/schemas/PngExportFormat'
          pptx: '#/components/schemas/PptxExportFormat'
          gif: '#/components/schemas/GifExportFormat'
          mp4: '#/components/schemas/Mp4ExportFormat'
          html_bundle: '#/components/schemas/HtmlBundleExportFormat'
          html_standalone: '#/components/schemas/HtmlStandaloneExportFormat'
          csv: '#/components/schemas/CsvExportFormat'
        propertyName: type
      oneOf:
      - $ref: '#/components/schemas/PdfExportFormat'
      - $ref: '#/components/schemas/JpgExportFormat'
      - $ref: '#/components/schemas/PngExportFormat'
      - $ref: '#/components/schemas/PptxExportFormat'
      - $ref: '#/components/schemas/GifExportFormat'
      - $ref: '#/components/schemas/Mp4ExportFormat'
      - $ref: '#/components/schemas/HtmlBundleExportFormat'
      - $ref: '#/components/schemas/HtmlStandaloneExportFormat'
      - $ref: '#/components/schemas/CsvExportFormat'
      type: object
    PdfExportFormat:
      description: Export the design as a PDF. Providing a paper size is optional.
      properties:
        type:
          enum:
          - pdf
          type: string
        export_quality:
          $ref: '#/components/schemas/ExportQuality'
        size:
          $ref: '#/components/schemas/ExportPageSize'
        pages:
          description: |-
            To specify which pages to export in a multi-page design, provide the page numbers as
            an array. The first page in a design is page `1`.
            If `pages` isn't specified, all the pages are exported.
          example:
          - 2
          - 3
          - 4
          items:
            format: int32
            minimum: 1
            type: integer
          type: array
      required:
      - type
      type: object
    GifExportFormat:
      description: |-
        Export the design as a GIF. Height or width (or both) may be specified, otherwise the file
        will be exported at it's default size. Large designs will be scaled down, and aspect ratio
        will always be maintained.
      properties:
        type:
          enum:
          - gif
          type: string
        export_quality:
          $ref: '#/components/schemas/ExportQuality'
        height:
          description: |-
            Specify the height in pixels of the exported image. Note the following behavior:

            - If no height or width is specified, the image is exported using the dimensions of the design.
            - If only one of height or width is specified, then the image is scaled to match that dimension, respecting the design's aspect ratio.
            - If both the height and width are specified, but the values don't match the design's aspect ratio, the export defaults to the larger dimension.
          example: 400
          format: int32
          maximum: 25000
          minimum: 40
          type: integer
        width:
          description: |-
            Specify the width in pixels of the exported image. Note the following behavior:

            - If no width or height is specified, the image is exported using the dimensions of the design.
            - If only one of width or height is specified, then the image is scaled to match that dimension, respecting the design's aspect ratio.
            - If both the width and height are specified, but the values don't match the design's aspect ratio, the export defaults to the larger dimension.
          example: 400
          format: int32
          maximum: 25000
          minimum: 40
          type: integer
        pages:
          description: |-
            To specify which pages to export in a multi-page design, provide the page numbers as
            an array. The first page in a design is page `1`.
            If `pages` isn't specified, all the pages are exported.
          example:
          - 2
          - 3
          - 4
          items:
            format: int32
            minimum: 1
            type: integer
          type: array
      required:
      - type
      type: object
    JpgExportFormat:
      description: |-
        Export the design as a JPEG. Compression quality must be provided. Height or width (or both)
        may be specified, otherwise the file will be exported at it's default size.

        If the user is on the Canva Free plan, the export height and width for a fixed-dimension design can't be upscaled by more than a factor of `1.125`.
      properties:
        type:
          enum:
          - jpg
          type: string
        export_quality:
          $ref: '#/components/schemas/ExportQuality'
        quality:
          description: "For the `jpg` type, the `quality` of the exported JPEG determines\
            \ how compressed the exported file should be. A _low_ `quality` value\
            \ will create a file with a smaller file size, but the resulting file\
            \ will have pixelated artifacts when compared to a file created with a\
            \ _high_ `quality` value."
          example: 80
          format: int32
          maximum: 100
          minimum: 1
          type: integer
        height:
          description: |-
            Specify the height in pixels of the exported image. Note the following behavior:

            - If no height or width is specified, the image is exported using the dimensions of the design.
            - If only one of height or width is specified, then the image is scaled to match that dimension, respecting the design's aspect ratio.
            - If both the height and width are specified, but the values don't match the design's aspect ratio, the export defaults to the larger dimension.
          example: 400
          format: int32
          maximum: 25000
          minimum: 40
          type: integer
        width:
          description: |-
            Specify the width in pixels of the exported image. Note the following behavior:

            - If no width or height is specified, the image is exported using the dimensions of the design.
            - If only one of width or height is specified, then the image is scaled to match that dimension, respecting the design's aspect ratio.
            - If both the width and height are specified, but the values don't match the design's aspect ratio, the export defaults to the larger dimension.
          example: 400
          format: int32
          maximum: 25000
          minimum: 40
          type: integer
        pages:
          description: |-
            To specify which pages to export in a multi-page design, provide the page numbers as
            an array. The first page in a design is page `1`.
            If `pages` isn't specified, all the pages are exported.
          example:
          - 2
          - 3
          - 4
          items:
            format: int32
            minimum: 1
            type: integer
          type: array
      required:
      - quality
      - type
      type: object
    PngExportFormat:
      description: |-
        Export the design as a PNG. Height or width (or both) may be specified, otherwise
        the file will be exported at it's default size. You may also specify whether to export the
        file losslessly, and whether to export a multi-page design as a single image.

        If the user is on the Canva Free plan, the export height and width for a fixed-dimension design can't be upscaled by more than a factor of `1.125`.
      properties:
        type:
          enum:
          - png
          type: string
        export_quality:
          $ref: '#/components/schemas/ExportQuality'
        height:
          description: |-
            Specify the height in pixels of the exported image. Note the following behavior:

            - If no height or width is specified, the image is exported using the dimensions of the design.
            - If only one of height or width is specified, then the image is scaled to match that dimension, respecting the design's aspect ratio.
            - If both the height and width are specified, but the values don't match the design's aspect ratio, the export defaults to the larger dimension.
          example: 400
          format: int32
          maximum: 25000
          minimum: 40
          type: integer
        width:
          description: |-
            Specify the width in pixels of the exported image. Note the following behavior:

            - If no width or height is specified, the image is exported using the dimensions of the design.
            - If only one of width or height is specified, then the image is scaled to match that dimension, respecting the design's aspect ratio.
            - If both the width and height are specified, but the values don't match the design's aspect ratio, the export defaults to the larger dimension.
          example: 400
          format: int32
          maximum: 25000
          minimum: 40
          type: integer
        lossless:
          default: true
          description: |-
            If set to `true` (default), the PNG is exported without compression.

            If set to `false`, the PNG is compressed using a lossy compression algorithm.

            AVAILABILITY: Lossy PNG compression is only available to users on a Canva plan that has premium features, such as Canva Pro. If the user is on the Canva Free plan and this parameter is set to `false`, the export operation will fail.
          type: boolean
        transparent_background:
          default: false
          description: |-
            If set to `true`, the PNG is exported with a transparent background.

            AVAILABILITY: This option is only available to users on a Canva plan that has premium features, such as Canva Pro. If the user is on the Canva Free plan and this parameter is set to `true`, the export operation will fail.
          type: boolean
        as_single_image:
          default: false
          description: |-
            When `true`, multi-page designs are merged into a single image.
            When `false` (default), each page is exported as a separate image.
          type: boolean
        pages:
          description: |-
            To specify which pages to export in a multi-page design, provide the page numbers as
            an array. The first page in a design is page `1`.
            If `pages` isn't specified, all the pages are exported.
          example:
          - 2
          - 3
          - 4
          items:
            format: int32
            minimum: 1
            type: integer
          type: array
      required:
      - type
      type: object
    PptxExportFormat:
      description: Export the design as a PPTX.
      properties:
        type:
          enum:
          - pptx
          type: string
        pages:
          description: |-
