  version: 2024-06-18
servers:
- description: Canva Connect API
  url: https://api.canva.com/rest
tags:
- description: Allow management of brands
  name: brands
- name: analytics
- name: app
- name: asset
- name: autofill
- name: brand_template
- name: comment
- name: connect
